<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Verification</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="twofa-content">
  <div class="twofa-container">
    <div class="twofa-icon">
      <ion-icon name="mail-outline" style="font-size: 48px; color: #2c3e50;"></ion-icon>
    </div>

    <h2>Two-Factor Authentication</h2>
    <p class="twofa-description">
      A verification code has been sent to your email address.
      Please enter the 6-digit code below.
    </p>

    <form (ngSubmit)="onVerify()" class="twofa-form">
      <ion-item>
        <ion-input
          type="text"
          label="Verification Code"
          labelPlacement="floating"
          [(ngModel)]="code"
          name="code"
          placeholder="123456"
          maxlength="6"
          inputmode="numeric"
        ></ion-input>
      </ion-item>

      @if (errorMessage) {
        <ion-note color="danger" class="error-message">{{ errorMessage }}</ion-note>
      }

      <ion-button
        type="submit"
        expand="block"
        class="verify-button"
      >
        Verify
      </ion-button>
    </form>

    <div class="resend-section">
      @if (resendDisabled) {
        <p class="resend-timer">Resend available in {{ resendCountdown }}s</p>
      } @else {
        <ion-button fill="clear" (click)="onResend()">
          Resend Code
        </ion-button>
      }
    </div>
  </div>
</ion-content>
