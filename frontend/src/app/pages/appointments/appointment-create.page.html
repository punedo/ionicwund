<app-admin-shell pageTitle="Termin anlegen">
  <div class="breadcrumb">
    <a (click)="onCancel()">Termine & Nachweise</a> / Termin anlegen
  </div>

  <div class="form-card">
    @if (errorMessage) {
      <div class="alert alert-error">{{ errorMessage }}</div>
    }

    <form #appointmentForm="ngForm" (ngSubmit)="onSubmit(appointmentForm)" class="appointment-form">
      <div class="form-row">
        <div class="form-group required">
          <label for="patientId">Patient</label>
          <select
            id="patientId"
            name="patientId"
            [(ngModel)]="appointment.patientId"
            (ngModelChange)="onPatientChange()"
            required
            class="form-control"
          >
            <option value="0" disabled>Patient auswählen</option>
            @for (p of patients; track p.id) {
              <option [value]="p.id">{{ p.lastName }}, {{ p.firstName }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="address">Adresse</label>
          <input
            type="text"
            id="address"
            name="address"
            [(ngModel)]="appointment.address"
            class="form-control"
            placeholder="Adresse"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group required">
          <label for="date">Datum</label>
          <input
            type="date"
            id="date"
            name="date"
            [(ngModel)]="appointment.date"
            required
            class="form-control"
          />
        </div>

        <div class="form-group required time-range">
          <label>Uhrzeit von – bis</label>
          <div class="time-inputs">
            <input
              type="time"
              name="startTime"
              [(ngModel)]="appointment.startTime"
              required
              class="form-control"
            />
            <input
              type="time"
              name="endTime"
              [(ngModel)]="appointment.endTime"
              required
              class="form-control"
            />
          </div>
          <span class="hint">Mo–Fr, 08:00–18:00, Mind. 30 Min</span>
        </div>
      </div>

      <div class="form-group">
        <label>Leistungsart</label>
        <div class="service-type-buttons">
          @for (type of serviceTypes; track type) {
            <button
              type="button"
              class="service-type-btn"
              [class.active]="appointment.serviceType === type"
              (click)="appointment.serviceType = type"
            >
              {{ type }}
            </button>
          }
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tour">Tour zuordnen</label>
          <select
            id="tour"
            name="tour"
            [(ngModel)]="appointment.tour"
            class="form-control"
          >
            <option value="">Tour auswählen</option>
            @for (t of tours; track t) {
              <option [value]="t">{{ t }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="repetition">Wiederholung</label>
          <select
            id="repetition"
            name="repetition"
            [(ngModel)]="appointment.repetition"
            class="form-control"
          >
            @for (r of repetitions; track r) {
              <option [value]="r">{{ r }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">Abbrechen</button>
        <button type="submit" class="btn-primary" [disabled]="saving">Termin anlegen</button>
      </div>
    </form>
  </div>
</app-admin-shell>
