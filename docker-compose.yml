version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ionicwund_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ionicwund
      MYSQL_USER: ionicwund_user
      MYSQL_PASSWORD: ionicwund_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ionicwund_network
    ports:
      - "3306:3306"

  # PHP-FPM for Symfony Backend
  backend-php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ionicwund_backend_php
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://ionicwund_user:ionicwund_pass@mysql:3306/ionicwund?serverVersion=8.0
    networks:
      - ionicwund_network
    depends_on:
      - mysql

  # Nginx for Symfony Backend
  backend-nginx:
    image: nginx:alpine
    container_name: ionicwund_backend_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ionicwund_network
    depends_on:
      - backend-php

  # Node.js for Ionic Frontend Build
  frontend-node:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ionicwund_frontend_node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run start -- --host 0.0.0.0 --port 4200
    networks:
      - ionicwund_network
    ports:
      - "4200:4200"

  # Nginx for Ionic Frontend (Production Build)
  frontend-nginx:
    image: nginx:alpine
    container_name: ionicwund_frontend_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/www:/usr/share/nginx/html
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ionicwund_network
    depends_on:
      - frontend-node

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ionicwund_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M
    networks:
      - ionicwund_network
    ports:
      - "8081:80"
    depends_on:
      - mysql

networks:
  ionicwund_network:
    driver: bridge

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
